# .env
spring.config.import=optional:file:./.env[.properties]
spring.application.name=lets-play

# MongoDB
spring.mongodb.uri=${MONGODB_URI}

# JWT
application.security.jwt.secret-key=${APPLICATION_SECURITY_JWT_SECRET_KEY}
application.security.jwt.expiration=${APPLICATION_SECURITY_JWT_EXPIRATION}

# Rate limiting (bonus feature)
application.security.rate-limit.enabled=true
application.security.rate-limit.requests-per-minute=100
application.security.rate-limit.auth-requests-per-minute=10

# REST behavior
# Unknown paths raise NoResourceFoundException (404 in JSON) instead of whitelabel
spring.web.resources.add-mappings=false

# Multipart
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB