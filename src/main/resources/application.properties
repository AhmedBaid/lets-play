# .env
spring.config.import=optional:file:./.env[.properties]
spring.application.name=lets-play

# MongoDB
spring.mongodb.uri=${MONGODB_URI}

# JWT
application.security.jwt.secret-key=${APPLICATION_SECURITY_JWT_SECRET_KEY}
application.security.jwt.expiration=${APPLICATION_SECURITY_JWT_EXPIRATION}


# Multipart
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# Do not re-run the security filter chain on ERROR dispatches.
# Exceptions thrown in the chain (e.g. GlobalException from the JWT filter,
# entry point or access-denied handler) are forwarded once to /error, where
# ApiErrorController renders them as JSON without re-triggering security.
spring.security.filter.dispatcher-types=async, request
